name: test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Linux regression
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Verify source checksums
        run: sha256sum --quiet -c MANIFEST.sha256
      - run: npm ci
      - run: npm test
      - run: python3 -B tests/video-worker.test.py

  install:
    name: Clean install and offline browser
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Initialize the PWA and preserve earlier settings
        run: |
          mkdir -p data
          printf '{}\n' > data/local.json
          if npm run setup -- https://pwa.test; then exit 1; fi
          test ! -e data/windows.local.json
          rm data/local.json
          npm run setup -- https://pwa.test
          test "$(stat -c %a data/windows.local.json)" = "600"
          sha256sum data/windows.local.json > "$RUNNER_TEMP/config.sha256"
          if npm run setup -- https://other.test; then exit 1; fi
          sha256sum -c "$RUNNER_TEMP/config.sha256"
          systemd-analyze verify scripts/ecs/zhiwei.service
      - name: Start the Hub and check the public PWA listener
        run: |
          export CODEX_HOME="$RUNNER_TEMP/no-credentials"
          export CODEX_CLI_PATH="$RUNNER_TEMP/no-model.mjs"
          printf 'process.exit(1);\n' > "$CODEX_CLI_PATH"
          node src/server.js > "$RUNNER_TEMP/zhiwei-hub.log" 2>&1 &
          hub=$!
          trap 'kill "$hub" 2>/dev/null || true' EXIT
          curl -fsS --retry 15 --retry-delay 1 --retry-connrefused \
            -H 'Host: pwa.test' http://127.0.0.1:3790/ > "$RUNNER_TEMP/index.html"
          grep -q 'app.v1.js' "$RUNNER_TEMP/index.html"
          status=$(curl -sS -o /dev/null -w '%{http_code}' -H 'Host: pwa.test' http://127.0.0.1:3790/api/pwa/me)
          test "$status" = "401"
          npm run --silent invite -- --database data/pwa/pwa.sqlite --origin https://pwa.test > "$RUNNER_TEMP/invite.json"
          node -e "const a=require(process.argv[1]); if(!a.secret || !a.link.startsWith('https://pwa.test/#invite='))process.exit(1)" "$RUNNER_TEMP/invite.json"
      - name: Install the browser specified by the locked Playwright package
        env:
          PLAYWRIGHT_BROWSERS_PATH: /var/cache/zhiwei-browsers
        run: |
          sudo env PLAYWRIGHT_BROWSERS_PATH="$PLAYWRIGHT_BROWSERS_PATH" "$(command -v node)" \
            node_modules/playwright-core/cli.js install --with-deps chromium
          browser=$(node -p "require('playwright-core').chromium.executablePath()")
          test -x "$browser"
          node -p "'playwright-core ' + require('playwright-core/package.json').version"
          "$browser" --version
          echo "ZHIWEI_TEST_BROWSER=$browser" >> "$GITHUB_ENV"
      - name: Exercise a program in the isolated systemd worker
        run: |
          python=/usr/bin/python3
          installer=scripts/ecs/creative-program-service.py
          # Only this synthetic CI worker records the browser startup trace.
          dropin=/run/systemd/system/zhiwei-creative@.service.d
          sudo install -d "$dropin"
          printf '[Service]\nEnvironment=DEBUG=pw:browser\n' | sudo tee "$dropin/diagnostics.conf" >/dev/null
          sudo "$python" "$installer" start --source "$PWD" --node "$(command -v node)" \
            --dependencies "$PWD/node_modules" --browser "$ZHIWEI_TEST_BROWSER" --client-group "$(id -gn)"
          trap 'sudo "$python" "$installer" stop' EXIT
          for trial in 1 2; do
            echo "Independent browser start $trial"
            if ! npm run check:runner; then
              sudo journalctl -b -u 'zhiwei-creative@*.service' --no-pager -n 100
              exit 1
            fi
          done

  release:
    name: Publish v2.03-r1
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release v2.03-r1]')
    needs: [test, install]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency: publish-zhiwei-v2-03-r1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Create the release for the tested commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=v2.03-r1
          test "$(cat VERSION)" = "$tag"
          tagged=$(git ls-remote --tags origin "refs/tags/$tag")
          if [ -n "$tagged" ]; then
            resolved=$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha)
            test "$resolved" = "$GITHUB_SHA"
          fi
          if gh release view "$tag" --json url --jq .url; then
            test -n "$tagged"
          else
            gh release create "$tag" --target "$GITHUB_SHA" --latest --title "知微 $tag" --notes-file "docs/release-$tag.md"
          fi
